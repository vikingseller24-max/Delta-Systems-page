<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delta Systems</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050505;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Hide outer page scrollbars while keeping scroll functional */
    html, body {
      scrollbar-width: none; /* Firefox */
      -ms-overflow-style: none; /* IE/Edge */
    }
    html::-webkit-scrollbar,
    body::-webkit-scrollbar {
      display: none; /* Chrome, Safari, Opera */
    }

    /* Background Layer: Heavy Ambient Blur */
    .bg-blur {
      position: fixed;
      inset: -12%;
      width: 124vw;
      height: 124vh;
      border: none;
      filter: blur(90px) saturate(1.3) brightness(0.75);
      transform: scale(1.15);
      pointer-events: none;
      z-index: 1;
    }

    /* Radial Gradient Vignette: Smoothly fades blur from 16:9 frame to screen edges */
    .bg-gradient-mask {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(
        ellipse at center,
        rgba(0, 0, 0, 0) 30%,
        rgba(0, 0, 0, 0.5) 68%,
        rgba(0, 0, 0, 0.94) 100%
      );
      pointer-events: none;
      z-index: 2;
    }

    /* Foreground 16:9 Container: Clips the inner scrollbar without blocking scrolling */
    .fg-wrapper {
      position: relative;
      aspect-ratio: 16 / 9;
      width: min(100vw, calc(100vh * (16 / 9)));
      height: min(100vh, calc(100vw * (9 / 16)));
      overflow: hidden;
      z-index: 3;
      box-shadow: 0 0 80px rgba(0, 0, 0, 0.9);
    }

    /* Foreground Canva Website: Slightly wider (+20px) to push its native scrollbar out of sight */
    .fg-content {
      width: calc(100% + 20px);
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Heavy blurred ambient background -->
  <iframe 
    class="bg-blur" 
    src="/site" 
    tabindex="-1" 
    aria-hidden="true">
  </iframe>

  <!-- Smooth gradient fading toward ultrawide edges -->
  <div class="bg-gradient-mask" aria-hidden="true"></div>

  <!-- Sharp 16:9 scrollable Canva website -->
  <div class="fg-wrapper">
    <iframe 
      class="fg-content" 
      src="/site" 
      allowfullscreen="allowfullscreen" 
      allow="fullscreen">
    </iframe>
  </div>

</body>
</html>
